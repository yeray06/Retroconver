# TEMPORAL (#146): genera los esquemas de Room 3, 4 y 5 compilando el código de cada versión
# y los sube a esta rama. Se borra en el commit siguiente, antes de abrir la PR.
name: Generar esquemas de Room (temporal)

on:
  push:
    branches: [chore/146-esquemas-room]

permissions:
  contents: write

jobs:
  esquemas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar cada versión y copiar su esquema
        run: |
          set -euo pipefail
          DESTINO="$PWD/app/schemas/com.retroconver.data.local.AppDatabase"
          generar() {
            local commit=$1 version=$2 dir=/tmp/v$2
            git worktree add --detach "$dir" "$commit"
            (cd "$dir" && ./gradlew --stacktrace :app:kspDebugKotlin)
            cp "$dir/app/schemas/com.retroconver.data.local.AppDatabase/$version.json" "$DESTINO/"
            echo "::notice title=Esquema $version::generado desde $commit"
          }
          generar e2c58ea0fe5a294a399a8e77602ac87cc8b122bc 3
          generar d30a674137c896e0e1e3b6bb594b57b78ded93ac 4
          generar $(git rev-parse HEAD) 5
          ls -la "$DESTINO"
      - name: Subir los esquemas a esta rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          git commit -m "Esquemas de Room 3, 4 y 5 generados por la CI (#146)"
          git push origin HEAD:refs/heads/chore/146-esquemas-room

name: Error
description: Algo no funciona como debería
title: "[Error] "
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el error.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión de Android
      placeholder: "Emulador Pixel 7, Android 14"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o registro (Logcat)
